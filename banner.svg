<svg width="1584" height="300" viewBox="0 0 1584 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1584" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050f07"/>
      <stop offset="0.5" stop-color="#0a1a0d"/>
      <stop offset="1" stop-color="#050f07"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1584" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#70F8BA" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#70F8BA" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#70F8BA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#70F8BA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="320" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#70F8BA"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodefx">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="300" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#70F8BA" stroke-width="0.5">
    <line x1="0" y1="60" x2="1584" y2="60"/>
    <line x1="0" y1="120" x2="1584" y2="120"/>
    <line x1="0" y1="180" x2="1584" y2="180"/>
    <line x1="0" y1="240" x2="1584" y2="240"/>
    <line x1="260" y1="0" x2="260" y2="300"/>
    <line x1="520" y1="0" x2="520" y2="300"/>
    <line x1="780" y1="0" x2="780" y2="300"/>
    <line x1="1040" y1="0" x2="1040" y2="300"/>
    <line x1="1300" y1="0" x2="1300" y2="300"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#70F8BA" stroke-width="1.5" opacity="0.6">
    <polyline points="32,10 10,10 10,42"/>
    <polyline points="1552,10 1574,10 1574,42"/>
    <polyline points="32,290 10,290 10,258"/>
    <polyline points="1552,290 1574,290 1574,258"/>
  </g>

  <!-- Separator lines -->
  <line x1="0" y1="56" x2="1584" y2="56" stroke="url(#lineGrad)" stroke-width="0.7"/>
  <line x1="0" y1="244" x2="1584" y2="244" stroke="url(#lineGrad)" stroke-width="0.7"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- AI BRAIN / NEURAL NETWORK ILLUSTRATION     -->
  <!-- Left side: x 30–230                        -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Outer brain glow -->
  <ellipse cx="130" cy="150" rx="88" ry="78" fill="#70F8BA" fill-opacity="0.03"/>
  <ellipse cx="130" cy="150" rx="72" ry="64" fill="#70F8BA" fill-opacity="0.04"/>

  <!-- Neural network connections (edges first, behind nodes) -->
  <g stroke="#70F8BA" stroke-width="0.7" opacity="0.2">
    <!-- Input layer to hidden layer 1 -->
    <line x1="62" y1="105" x2="105" y2="118"/>
    <line x1="62" y1="105" x2="105" y2="150"/>
    <line x1="62" y1="105" x2="105" y2="182"/>
    <line x1="62" y1="138" x2="105" y2="118"/>
    <line x1="62" y1="138" x2="105" y2="150"/>
    <line x1="62" y1="138" x2="105" y2="182"/>
    <line x1="62" y1="170" x2="105" y2="118"/>
    <line x1="62" y1="170" x2="105" y2="150"/>
    <line x1="62" y1="170" x2="105" y2="182"/>
    <line x1="62" y1="200" x2="105" y2="118"/>
    <line x1="62" y1="200" x2="105" y2="150"/>
    <line x1="62" y1="200" x2="105" y2="182"/>
    <!-- Hidden layer 1 to hidden layer 2 -->
    <line x1="105" y1="118" x2="155" y2="110"/>
    <line x1="105" y1="118" x2="155" y2="140"/>
    <line x1="105" y1="118" x2="155" y2="170"/>
    <line x1="105" y1="150" x2="155" y2="110"/>
    <line x1="105" y1="150" x2="155" y2="140"/>
    <line x1="105" y1="150" x2="155" y2="170"/>
    <line x1="105" y1="182" x2="155" y2="110"/>
    <line x1="105" y1="182" x2="155" y2="140"/>
    <line x1="105" y1="182" x2="155" y2="170"/>
    <!-- Hidden layer 2 to output -->
    <line x1="155" y1="110" x2="198" y2="130"/>
    <line x1="155" y1="110" x2="198" y2="160"/>
    <line x1="155" y1="140" x2="198" y2="130"/>
    <line x1="155" y1="140" x2="198" y2="160"/>
    <line x1="155" y1="170" x2="198" y2="130"/>
    <line x1="155" y1="170" x2="198" y2="160"/>
  </g>

  <!-- Highlighted / active connections -->
  <g stroke="#70F8BA" stroke-width="1" opacity="0.55">
    <line x1="62" y1="138" x2="105" y2="150"/>
    <line x1="105" y1="150" x2="155" y2="140"/>
    <line x1="155" y1="140" x2="198" y2="160"/>
  </g>
  <g stroke="#E64040" stroke-width="0.8" opacity="0.4">
    <line x1="62" y1="170" x2="105" y2="182"/>
    <line x1="105" y1="182" x2="155" y2="170"/>
    <line x1="155" y1="170" x2="198" y2="130"/>
  </g>

  <!-- Input layer nodes -->
  <g filter="url(#nodefx)">
    <circle cx="62" cy="105" r="5.5" fill="#0a1a0d" stroke="#70F8BA" stroke-width="1.2"/>
    <circle cx="62" cy="138" r="5.5" fill="#70F8BA" fill-opacity="0.9"/>
    <circle cx="62" cy="170" r="5.5" fill="#0a1a0d" stroke="#E64040" stroke-width="1.2"/>
    <circle cx="62" cy="200" r="5.5" fill="#0a1a0d" stroke="#70F8BA" stroke-width="1.2"/>
  </g>

  <!-- Hidden layer 1 nodes -->
  <g filter="url(#nodefx)">
    <circle cx="105" cy="118" r="6" fill="#0a1a0d" stroke="#70F8BA" stroke-width="1.2"/>
    <circle cx="105" cy="150" r="6" fill="#70F8BA" fill-opacity="0.85"/>
    <circle cx="105" cy="182" r="6" fill="#0a1a0d" stroke="#E64040" stroke-width="1.2"/>
  </g>

  <!-- Hidden layer 2 nodes -->
  <g filter="url(#nodefx)">
    <circle cx="155" cy="110" r="6" fill="#0a1a0d" stroke="#70F8BA" stroke-width="1.2"/>
    <circle cx="155" cy="140" r="6" fill="#70F8BA" fill-opacity="0.8"/>
    <circle cx="155" cy="170" r="6" fill="#0a1a0d" stroke="#E64040" stroke-width="1.2"/>
  </g>

  <!-- Output layer nodes -->
  <g filter="url(#nodefx)">
    <circle cx="198" cy="130" r="7" fill="#E64040" fill-opacity="0.7"/>
    <circle cx="198" cy="160" r="7" fill="#70F8BA" fill-opacity="0.9"/>
  </g>

  <!-- Animated pulse on active node -->
  <circle cx="105" cy="150" r="6" fill="none" stroke="#70F8BA" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="6;14;6" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="198" cy="160" r="7" fill="none" stroke="#70F8BA" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="7;16;7" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- AI label below brain -->
  <text x="130" y="248" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#70F8BA" opacity="0.35" letter-spacing="4">NEURAL NET</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CENTRE — Name + identity                   -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Main name -->
  <text x="320" y="148"
        font-family="'Courier New', monospace"
        font-size="68"
        font-weight="700"
        letter-spacing="5"
        fill="url(#nameGrad)"
        filter="url(#softglow)">RAJKUMAR G</text>

  <!-- Blinking cursor -->
  <rect x="1052" y="98" width="5" height="54" fill="#70F8BA" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Role -->
  <text x="322" y="185"
        font-family="'Courier New', monospace"
        font-size="18"
        letter-spacing="3"
        fill="#70F8BA"
        opacity="0.72">AI / ML Engineer  ·  Data Scientist  ·  India</text>

  <!-- Skill tags -->
  <text x="322" y="213"
        font-family="'Courier New', monospace"
        font-size="13"
        fill="#70F8BA"
        opacity="0.38"
        letter-spacing="2">[ NLP ]  [ Computer Vision ]  [ LLMs ]  [ RAG ]  [ MLOps ]</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- RIGHT BOX — Credentials                    -->
  <!-- Box: x=1100 to x=1560, y=80 to y=225      -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Box border -->
  <rect x="1108" y="78" width="442" height="152" rx="4"
        fill="#70F8BA" fill-opacity="0.03"
        stroke="#70F8BA" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Box top-left label -->
  <text x="1118" y="72" font-family="'Courier New', monospace" font-size="10"
        fill="#70F8BA" opacity="0.3" letter-spacing="2">CREDENTIALS</text>

  <!-- Row 1: 3x Intern -->
  <rect x="1120" y="90" width="180" height="28" rx="3"
        fill="#70F8BA" fill-opacity="0.08" stroke="#70F8BA" stroke-width="0.6" stroke-opacity="0.35"/>
  <text x="1210" y="109" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13"
        fill="#70F8BA" opacity="0.88">3× Industry Intern</text>

  <!-- Row 1: Hackathon Winner -->
  <rect x="1316" y="90" width="220" height="28" rx="3"
        fill="#E64040" fill-opacity="0.1" stroke="#E64040" stroke-width="0.6" stroke-opacity="0.45"/>
  <text x="1426" y="109" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13"
        fill="#E64040" opacity="0.9">🏆 Hackathon Winner</text>

  <!-- Row 2: Springer · Wiley -->
  <rect x="1120" y="132" width="180" height="28" rx="3"
        fill="#70F8BA" fill-opacity="0.08" stroke="#70F8BA" stroke-width="0.6" stroke-opacity="0.35"/>
  <text x="1210" y="151" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13"
        fill="#70F8BA" opacity="0.88">Springer · Wiley</text>

  <!-- Row 2: EY Top 300 / 9000+ -->
  <rect x="1316" y="132" width="220" height="28" rx="3"
        fill="#70F8BA" fill-opacity="0.06" stroke="#70F8BA" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="1426" y="151" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13"
        fill="#70F8BA" opacity="0.7">EY Top 300 / 9,000+</text>

  <!-- Row 3: IIM full width -->
  <rect x="1120" y="174" width="416" height="28" rx="3"
        fill="#70F8BA" fill-opacity="0.05" stroke="#70F8BA" stroke-width="0.6" stroke-opacity="0.2"/>
  <text x="1328" y="193" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13"
        fill="#70F8BA" opacity="0.6">IIM Ahmedabad EcoAI · Top 1.5% of 2,900+</text>

  <!-- Tagline bottom -->
  <text x="792" y="268"
        text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="13"
        fill="#70F8BA"
        opacity="0.28"
        letter-spacing="2">" I don't just train models. I build systems that think. "</text>

  <!-- Animated dots top-right -->
  <circle cx="1562" cy="24" r="4" fill="#70F8BA" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1548" cy="24" r="3" fill="#70F8BA" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.05;0.35" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1537" cy="24" r="2" fill="#70F8BA" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.02;0.15" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
